spring:
  application:
    name: microservice

  datasource:
    url: jdbc:postgresql://localhost:5432/timedb
    driver-class-name: org.postgresql.Driver
    username: timedb
    password: timedb

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.format_sql: true

# Application configuration.
# access-mode selects the DB-access layer at startup: jooq (default) or orm.
# It also drives the @ConditionalOnProperty switch on the two TimeRepository beans.
app:
  db:
    access-mode: jooq

server:
  port: 8080

logging:
  level:
    org.jooq.Constants: warn
